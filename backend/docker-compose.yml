services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-media-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      BULK_CONCURRENCY: ${BULK_CONCURRENCY:-2}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: ffmpeg
      DOWNLOAD_TIMEOUT_MS: 600000
      TEMP_DIR: /app/storage/tmp
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}
    tmpfs:
      - /tmp:exec,mode=1777
    volumes:
      - media_scratch:/app/storage/tmp
    restart: unless-stopped

volumes:
  media_scratch:
